
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      APP_LEDGER_HMAC_SECRET: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Check skill files
        run: |
          for d in $(find brain/skills -mindepth 1 -maxdepth 1 -type d); do
            if [ ! -f "$d/SKILL.md" ]; then echo "Missing SKILL.md in $d"; exit 1; fi
          done
